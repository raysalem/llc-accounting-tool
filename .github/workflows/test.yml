name: Tests

# Every push to any branch, every pull request, and a manual "Run workflow" button.
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

# The repo is private: a newer push to the same branch cancels the older run to save minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ '20.x', '22.x' ]
        include:
          # Ray runs the tool on Windows (paths, CRLF, Excel files): one Windows run.
          - os: windows-latest
            node-version: '22.x'

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for personal data
      run: npm run check-sensitive

    - name: Lint
      run: npm run lint

    - name: Run all tests
      run: npm test
